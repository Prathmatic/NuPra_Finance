<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="npBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="npTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="npPGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Dark Slate Background -->
  <rect width="100" height="100" rx="26" fill="#090d16"/>
  <!-- Outer metallic border -->
  <rect x="3" y="3" width="94" height="94" rx="23" stroke="url(#npBorderGrad)" stroke-width="4" stroke-opacity="0.85"/>
  <!-- Inner Card -->
  <rect x="8" y="8" width="84" height="84" rx="19" fill="#0f172a" fill-opacity="0.95"/>
  <!-- NP Monogram -->
  <text x="34" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#npTextGrad)" text-anchor="middle" letter-spacing="-2">N</text>
  <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#npPGrad)" text-anchor="middle" letter-spacing="-2">P</text>
  <!-- Accent dot -->
  <circle cx="78" cy="73" r="3.5" fill="#10b981"/>
</svg>