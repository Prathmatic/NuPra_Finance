name: Build NuPra Finance APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            VITE_SUPABASE_URL="$(sed -n 's/^[[:space:]]*VITE_SUPABASE_URL[[:space:]]*=[[:space:]]*//p' .env.example | head -n 1)"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            VITE_SUPABASE_ANON_KEY="$(sed -n 's/^[[:space:]]*VITE_SUPABASE_ANON_KEY[[:space:]]*=[[:space:]]*//p' .env.example | head -n 1)"
          fi
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Configure Supabase values in .env.example or GitHub Actions variables."
            exit 1
          fi
          export VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp -v {} "release-apk/NuPra Finance.apk" \;
          echo "APK located and prepared:"
          ls -la release-apk/

      - name: Upload NuPra Finance.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuPra-Finance-APK
          path: "release-apk/NuPra Finance.apk"
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: mobile-apk
          name: "NuPra Finance Mobile App APK"
          body: |
            ### 📱 NuPra Finance Android APK
            Download **`NuPra Finance.apk`** below to install directly on your Android phone!
            
            - **App Name**: NuPra Finance
            - **Package**: `com.nupra.finance`
            - **Target**: Android
          files: release-apk/NuPra Finance.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

