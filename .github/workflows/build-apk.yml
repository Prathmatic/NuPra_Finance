name: Build NuPra Finance APK

on:
  push:
    branches: [ main, master, NuPra_nupur_version ]
  pull_request:
    branches: [ main, master, NuPra_nupur_version ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            VITE_SUPABASE_URL="$(sed -n 's/^[[:space:]]*VITE_SUPABASE_URL[[:space:]]*=[[:space:]]*//p' .env.example | head -n 1)"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            VITE_SUPABASE_ANON_KEY="$(sed -n 's/^[[:space:]]*VITE_SUPABASE_ANON_KEY[[:space:]]*=[[:space:]]*//p' .env.example | head -n 1)"
          fi
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Configure Supabase values in .env.example or GitHub Actions variables."
            exit 1
          fi
          export VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Verify APK
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp -v {} "release-apk/NuPra Finance.apk" \;
          if [ ! -s "release-apk/NuPra Finance.apk" ]; then
            echo "::error::No APK file produced by Gradle build!"
            exit 1
          fi
          echo "APK located and prepared successfully:"
          ls -lh release-apk/

      - name: Upload NuPra Finance.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuPra-Finance-APK
          path: "release-apk/NuPra Finance.apk"
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/NuPra_nupur_version')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BUILD_TAG="v1.0.${{ github.run_number }}"
          echo "Publishing release for $BUILD_TAG..."

          # 1. Create a fresh, versioned release with APK attached
          gh release create "$BUILD_TAG" "release-apk/NuPra Finance.apk" \
            --title "NuPra Finance Mobile App v1.0.${{ github.run_number }}" \
            --notes "### 📱 NuPra Finance Android APK

          Download **\`NuPra Finance.apk\`** below to install directly on your Android phone!

          - **Build**: #${{ github.run_number }}
          - **Branch**: \`${{ github.ref_name }}\`
          - **Commit**: \`${{ github.sha }}\`" \
            --latest

          # 2. Also update or create the persistent 'mobile-apk' release
          gh release upload mobile-apk "release-apk/NuPra Finance.apk" --clobber 2>/dev/null || \
          gh release create mobile-apk "release-apk/NuPra Finance.apk" \
            --title "NuPra Finance Mobile App APK" \
            --notes "### 📱 NuPra Finance Android APK (Latest)
          Download **\`NuPra Finance.apk\`** below.
          - **Latest commit**: \`${{ github.sha }}\`" \
            --clobber || true
